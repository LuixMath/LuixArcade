<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="e-title"><title id="e-title">Original Echoes concept art: forest ruins, distant mountains and an ancient circular gateway</title>
<defs>
